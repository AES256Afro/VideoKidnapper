# SPDX-License-Identifier: Apache-2.0
#
# On every tag push (v*.*.*), build macOS .app bundles wrapped in .dmg
# installers for both architectures and attach them to the GitHub
# Release. FFmpeg is bundled (a .app has no reliable PATH — same
# reasoning as the MSIX container and the AppImage's AppRun).
#
# Signing: with the MACOS_* secrets present (they are, since v1.8.2)
# the .app is Developer-ID signed, notarized by Apple, and the ticket is
# stapled into the .dmg — a normal double-click opens it. Without the
# secrets (a fork, or a PR from one) the build still succeeds, ad-hoc
# signed, and Gatekeeper asks the user to allow it once. See
# packaging/macos/README.md for the two modes and the setup script.
#
# The ad-hoc signature is load-bearing even though it buys no trust: the
# arm64 kernel refuses to exec an improperly signed binary at all. Any
# step that writes into the bundle MUST be followed by a re-sign — see
# the "Re-sign the bundle" step. 1.8.0 shipped without one and every
# macOS DMG was unlaunchable ("VideoKidnapper is damaged").

name: macOS build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  pull_request:
    paths:
      - ".github/workflows/macos.yml"
      - "packaging/videokidnapper-macos.spec"
      - "packaging/macos/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the DMGs to (e.g. v1.6.0); empty = artifact only"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build .app + .dmg
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14      # Apple Silicon (arm64)
            arch: arm64
          - runner: macos-15-intel # Intel (x86_64)
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # OpenCV (headless contrib: CSRT tracker, no GUI libs) for auto-track.
          pip install "opencv-contrib-python-headless>=4.8"
          pip install "pyinstaller>=6.0"

      - name: Build .app
        run: |
          python -m PyInstaller packaging/videokidnapper-macos.spec --noconfirm --clean
          test -d "dist/VideoKidnapper.app"

      - name: Bundle FFmpeg (static GPL builds)
        # Source differs per arch — evermeet.cx ships **Intel-only**
        # binaries despite the "macOS" label, so up to 1.8.0 the arm64
        # DMG carried an x86_64 ffmpeg that needed Rosetta to run at all.
        # Apple Silicon takes eugeneware/ffmpeg-static, which publishes
        # genuine darwin-arm64 builds. GPL either way — source linked in
        # the release notes, same policy as the Linux/Windows builds.
        env:
          FFMPEG_STATIC_TAG: b6.1.1
        run: |
          set -euo pipefail
          mkdir -p ffbin
          case "${{ matrix.arch }}" in
            x86_64)
              for bin in ffmpeg ffprobe; do
                curl -fsSL -o "$bin.zip" "https://evermeet.cx/ffmpeg/getrelease/$bin/zip"
                unzip -o "$bin.zip" -d ffbin
              done
              ;;
            arm64)
              base="https://github.com/eugeneware/ffmpeg-static/releases/download/${FFMPEG_STATIC_TAG}"
              for bin in ffmpeg ffprobe; do
                curl -fsSL -o "ffbin/$bin" "$base/$bin-darwin-arm64"
              done
              ;;
            *)
              echo "::error::unhandled arch ${{ matrix.arch }}"; exit 1 ;;
          esac
          RES="dist/VideoKidnapper.app/Contents/Resources/assets/ffmpeg/bin"
          mkdir -p "$RES"
          cp ffbin/ffmpeg ffbin/ffprobe "$RES/"
          chmod +x "$RES/ffmpeg" "$RES/ffprobe"

          # Guard: a mismatched binary is the 1.8.0 bug. Fail the build
          # rather than shipping something that needs Rosetta (or that
          # simply will not exec on a machine without it).
          for bin in ffmpeg ffprobe; do
            if ! file -b "$RES/$bin" | grep -q "${{ matrix.arch }}"; then
              echo "::error::$bin is $(file -b "$RES/$bin"), expected ${{ matrix.arch }}"
              exit 1
            fi
          done
          "$RES/ffmpeg" -version | head -1

      - name: Detect signing configuration
        id: signing
        # Secrets are unavailable to PRs from forks, and are simply
        # absent until the repo owner adds them. Either way the build
        # must still produce a working (ad-hoc signed) DMG rather than
        # failing — so every signing step below is conditional on this.
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          NOTARY_PW: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          if [ -n "${CERT:-}" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
            echo "Developer ID signing: enabled"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "Developer ID signing: disabled (no MACOS_CERT_P12_BASE64) — ad-hoc"
          fi
          if [ -n "${CERT:-}" ] && [ -n "${NOTARY_PW:-}" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
            echo "Notarization: enabled"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "Notarization: disabled"
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.sign == 'true'
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # A dedicated, throwaway keychain: never touch the runner's
          # login keychain, and let the whole thing die with the VM.
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          # Random per-run password; it only guards a keychain that
          # exists for the length of this job.
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          # Resolve the identity from the keychain rather than trusting a
          # hand-typed secret — a typo here would otherwise surface as a
          # confusing codesign error much later.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | head -1 \
            | sed -E 's/.*"(.*)"/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::no 'Developer ID Application' identity in the .p12."
            echo "::error::Export it from Keychain Access *with its private key*."
            security find-identity -v "$KEYCHAIN" || true
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing identity: $IDENTITY"

      - name: Re-sign the bundle
        # MUST run after FFmpeg lands in Contents/Resources. PyInstaller
        # ad-hoc signs the .app at build time, which seals a manifest of
        # every resource; dropping files in afterwards invalidates that
        # seal. Gatekeeper then rejects the quarantined app on a user's
        # machine with "VideoKidnapper is damaged and can't be opened"
        # — unfixable by the right-click → Open workaround, because it
        # is not an unidentified-developer prompt. That shipped in 1.8.0
        # and made every macOS DMG unlaunchable.
        #
        # With a Developer ID available this also switches on the
        # hardened runtime, which notarization requires. See
        # packaging/macos/entitlements.plist for why each entitlement is
        # needed by a PyInstaller-packaged CPython app.
        env:
          SIGNED: ${{ steps.signing.outputs.sign }}
        run: |
          set -euo pipefail
          APP="dist/VideoKidnapper.app"
          RES="$APP/Contents/Resources/assets/ffmpeg/bin"
          ENTITLEMENTS="packaging/macos/entitlements.plist"

          if [ "$SIGNED" != "true" ]; then
            # Ad-hoc: no timestamp server, and the hardened runtime would
            # only cause launch failures without a real identity.
            codesign --force --deep --sign - --timestamp=none "$APP"
            exit 0
          fi

          # --deep is explicitly discouraged by Apple for Developer ID
          # and does not apply entitlements correctly, so walk the
          # Mach-O files ourselves. Sorting by path depth (deepest
          # first) guarantees nested code is signed before whatever
          # contains it — signing a container invalidates anything
          # signed inside it afterwards.
          #
          # The predicate below was checked against a real 1.8.1 bundle:
          # it finds all 203 Mach-O files, including the bundled
          # ffmpeg/ffprobe (which arrive signed by their upstream
          # publisher and need *our* identity for notarization).
          find "$APP/Contents" -type f \
            \( -name '*.dylib' -o -name '*.so' -o -perm -u+x \) -print0 \
            | xargs -0 file --mime-type 2>/dev/null \
            | grep 'application/x-mach-binary' | cut -d: -f1 \
            | awk '{print gsub(/\//,"/"), $0}' | sort -rn | cut -d' ' -f2- \
            > /tmp/machos.txt
          echo "signing $(wc -l < /tmp/machos.txt | tr -d ' ') nested Mach-O files"

          # Nested code gets the hardened runtime but NOT the
          # entitlements: those belong on the main executable, which the
          # bundle signature below covers. A failure here would surface
          # as an opaque "Invalid" from the notary service, so collect
          # them and fail loudly instead of pressing on.
          failed=0
          while read -r macho; do
            if ! codesign --force --sign "$SIGN_IDENTITY" --timestamp \
                   --options runtime "$macho" 2>/tmp/cs.err; then
              echo "::error::codesign failed on ${macho#"$APP/"}: $(cat /tmp/cs.err)"
              failed=$((failed + 1))
            fi
          done < /tmp/machos.txt
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed nested binaries could not be signed"
            exit 1
          fi

          # Finally the bundle itself, with entitlements.
          codesign --force --sign "$SIGN_IDENTITY" --timestamp \
            --options runtime --entitlements "$ENTITLEMENTS" "$APP"
          rm -f /tmp/machos.txt /tmp/cs.err

      - name: Verify signature (release gate)
        # The launch smoke-test below CANNOT catch a broken seal: the
        # runner's build tree has no com.apple.quarantine xattr, so
        # Gatekeeper never evaluates it and the binary execs fine. This
        # explicit check is the only thing standing between a broken
        # seal and a shipped DMG. Do not remove.
        run: |
          set -euo pipefail
          APP="dist/VideoKidnapper.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # --verify exits 0 on success, but a stray "file added:" line
          # means an unsealed resource slipped in — treat it as fatal.
          if codesign --verify --strict --verbose=4 "$APP" 2>&1 \
               | grep -E '^(file added|file modified|file missing)'; then
            echo "::error::unsealed resources in the bundle — re-sign step is broken"
            exit 1
          fi
          echo "signature OK: $(codesign -dv "$APP" 2>&1 | grep -i '^Signature')"

      - name: Gatekeeper dry-run (quarantined copy)
        # The smoke-test below runs the binary straight out of the build
        # tree, which carries no com.apple.quarantine xattr — so
        # Gatekeeper never evaluates it and a broken bundle passes. This
        # step reproduces what a user gets from a browser download by
        # setting the quarantine flag on a throwaway copy.
        #
        # An un-notarized app is *expected* to be refused; that is the
        # "Open Anyway" prompt and it is fine. What must never appear is
        # a structural verdict like "a sealed resource is missing or
        # invalid", which is the unrecoverable "app is damaged" failure.
        run: |
          set -uo pipefail
          rm -rf /tmp/gkcheck && mkdir -p /tmp/gkcheck
          cp -R "dist/VideoKidnapper.app" /tmp/gkcheck/
          xattr -w com.apple.quarantine "0083;00000000;Safari;" \
            /tmp/gkcheck/VideoKidnapper.app
          verdict="$(spctl -a -t exec -vvv /tmp/gkcheck/VideoKidnapper.app 2>&1 || true)"
          echo "$verdict"
          case "$verdict" in
            *"sealed resource"*|*"invalid Info.plist"*|*"code has no resources"*|*"obsolete resource envelope"*)
              echo "::error::bundle is structurally broken — users see \"VideoKidnapper is damaged\""
              exit 1 ;;
          esac
          rm -rf /tmp/gkcheck

      - name: Smoke-test — --help exits 0
        # argparse runs before Tk needs a display (headless runner).
        run: |
          "dist/VideoKidnapper.app/Contents/MacOS/VideoKidnapper" --help
          "dist/VideoKidnapper.app/Contents/MacOS/VideoKidnapper" --selftest

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            raw="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            raw="${GITHUB_REF_NAME}"
          else
            raw="v0.0.0"
          fi
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"

      - name: Build .dmg
        run: |
          brew install create-dmg
          mkdir -p dmgroot
          cp -R "dist/VideoKidnapper.app" dmgroot/
          OUT="VideoKidnapper-${{ steps.v.outputs.version }}-macos-${{ matrix.arch }}.dmg"
          create-dmg \
            --volname "VideoKidnapper" \
            --app-drop-link 450 180 \
            --icon "VideoKidnapper.app" 150 180 \
            --window-size 640 360 \
            "$OUT" dmgroot/ || \
            hdiutil create -volname "VideoKidnapper" -srcfolder dmgroot -ov -format UDZO "$OUT"
          echo "dmg=$OUT" >> "$GITHUB_ENV"
          ls -la "$OUT"

      - name: Sign the .dmg
        if: steps.signing.outputs.sign == 'true'
        # The disk image is itself a distributed artifact and Gatekeeper
        # checks it before the app inside is ever mounted.
        run: |
          set -euo pipefail
          codesign --force --sign "$SIGN_IDENTITY" --timestamp "$dmg"
          codesign --verify --verbose=2 "$dmg"

      - name: Notarize and staple
        if: steps.signing.outputs.notarize == 'true'
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          # --wait blocks until Apple returns a verdict (usually 1-5
          # minutes). On rejection, print the full log — "Invalid" alone
          # is useless for debugging, the log names the offending binary.
          if ! xcrun notarytool submit "$dmg" \
                 --apple-id "$APPLE_ID" \
                 --team-id "$TEAM_ID" \
                 --password "$NOTARY_PASSWORD" \
                 --wait --timeout 30m \
                 --output-format json > notary.json; then
            echo "::error::notarization failed"
            cat notary.json || true
            id="$(python3 -c "import json;print(json.load(open('notary.json')).get('id',''))" 2>/dev/null || true)"
            [ -n "$id" ] && xcrun notarytool log "$id" \
              --apple-id "$APPLE_ID" --team-id "$TEAM_ID" \
              --password "$NOTARY_PASSWORD" || true
            exit 1
          fi
          cat notary.json

          # Staple the ticket INTO the .dmg so first launch works with no
          # network. Without this the app still passes, but only if the
          # user is online when Gatekeeper phones home.
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          rm -f notary.json

      - name: Verify the shipped .dmg the way a user's Mac will
        # The earlier Gatekeeper dry-run checked the .app in the build
        # tree. This checks the actual artifact being uploaded, with
        # quarantine set, which is the only thing users ever touch.
        env:
          NOTARIZED: ${{ steps.signing.outputs.notarize }}
        run: |
          set -uo pipefail
          rm -rf /tmp/dmgcheck && mkdir -p /tmp/dmgcheck
          cp "$dmg" /tmp/dmgcheck/check.dmg
          xattr -w com.apple.quarantine "0083;00000000;Safari;" /tmp/dmgcheck/check.dmg
          hdiutil attach /tmp/dmgcheck/check.dmg -nobrowse -readonly \
            -mountpoint /tmp/dmgcheck/mnt -quiet
          verdict="$(spctl -a -t exec -vvv /tmp/dmgcheck/mnt/VideoKidnapper.app 2>&1 || true)"
          echo "$verdict"
          hdiutil detach /tmp/dmgcheck/mnt -quiet || true
          rm -rf /tmp/dmgcheck

          case "$verdict" in
            *"sealed resource"*|*"invalid Info.plist"*|*"code has no resources"*)
              echo "::error::bundle is structurally broken — users see \"VideoKidnapper is damaged\""
              exit 1 ;;
          esac

          if [ "$NOTARIZED" = "true" ]; then
            # Notarized builds must be *accepted*. Anything less means
            # users still get a scary prompt despite paying for the cert.
            case "$verdict" in
              *accepted*) echo "notarized and accepted by Gatekeeper — clean first launch" ;;
              *) echo "::error::notarization ran but Gatekeeper still says: $verdict"
                 exit 1 ;;
            esac
          else
            echo "note: un-notarized build — users get one 'Open Anyway' trip. Expected."
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoKidnapper-macos-${{ matrix.arch }}
          path: ${{ env.dmg }}
          retention-days: 7

  attach:
    name: Attach DMGs to Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: VideoKidnapper-macos-*
          path: dist/
          merge-multiple: true
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          notes=$'macOS builds for '"$tag"$'.\n\n- Apple Silicon: `*-macos-arm64.dmg`  ·  Intel: `*-macos-x86_64.dmg`\n- FFmpeg is bundled (matching the DMG\'s architecture).\n- **Signed and notarized by Apple.** Drag to Applications and double-click — no security prompt. If you see "Apple could not verify..." you are running an older build; upgrade.'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.dmg --clobber
          else
            gh release create "$tag" dist/*.dmg --title "$tag" --notes "$notes"
          fi
