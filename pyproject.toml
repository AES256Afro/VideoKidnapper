#
# Build + packaging metadata for PyPI.
# Version is owned by videokidnapper/__init__.py (__version__) — bump
# there and the tag-push release workflow picks it up automatically.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videokidnapper"
dynamic = ["version"]
description = "Desktop tool for trimming videos, downloading clips from the open web, and exporting polished GIFs or MP4s with text overlays."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Christopher Courtney", email = "noreply@github.com" },
]
keywords = [
    "video", "gif", "ffmpeg", "yt-dlp", "trim", "clip", "subtitle",
    "overlay", "editor", "desktop", "customtkinter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
    "Topic :: Utilities",
]
dependencies = [
    "customtkinter>=5.2.0,<7.0",
    "Pillow>=10.0.0,<13.0",
    "mss>=9.0.0,<11.0",
    "yt-dlp>=2024.0.0",
]

[project.optional-dependencies]
# Drag-and-drop support. The app degrades gracefully when missing, so
# users who don't want the extra native dep can skip this.
dnd = ["tkinterdnd2>=0.3.0"]
# Auto-tracking for motion captions (⚡ Auto-track). Optional: the manual
# keyframe path works without it, and the button explains how to install.
# contrib build for the CSRT tracker.
track = ["opencv-contrib-python-headless>=4.8"]
# Aggregate: everything, for `pip install videokidnapper[all]`.
all = ["tkinterdnd2>=0.3.0", "opencv-contrib-python-headless>=4.8"]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "build>=1.0",
]

[project.scripts]
videokidnapper = "videokidnapper.cli:main"

[project.urls]
Homepage = "https://videokidnapper.com"
Repository = "https://github.com/AES256Afro/VideoKidnapper"
Issues = "https://github.com/AES256Afro/VideoKidnapper/issues"
Changelog = "https://github.com/AES256Afro/VideoKidnapper/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Setuptools specifics
# ---------------------------------------------------------------------------

# Auto-discovery, scoped to the package tree. An explicit list was used
# here until 1.8.1, but it silently dropped every subpackage added after
# it was written — `core.ffmpeg` and `plugins` were missing from the
# 1.8.0 wheel, so `import videokidnapper.core.ffmpeg_backend` raised
# ModuleNotFoundError on a clean `pip install`. The glob keeps the sdist
# equally lean (tests/, scripts/, and the assets/ screenshot blob all sit
# outside `videokidnapper/`) without needing maintenance.
#
# tests/test_packaging.py asserts discovery stays in sync with the tree.
[tool.setuptools.packages.find]
include = ["videokidnapper*"]

[tool.setuptools.package-data]
# The window/taskbar icon ships inside the package so pip installs and
# the PyInstaller bundle both find it via Path(__file__).
videokidnapper = ["assets/*"]

[tool.setuptools.dynamic]
version = { attr = "videokidnapper.__version__" }

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
#
# The rule set is pinned explicitly rather than inherited from ruff's
# defaults. Those defaults are not a stable contract: ruff 0.16.1 widened
# them, and because ci.yml did a bare `pip install ruff`, the Ruff job
# started failing on 2026-08-01 with 300+ findings and no code change
# behind it. The values below are ruff's historical defaults, which the
# tree is clean against.
#
# Adopting more rules (BLE001, I001 and S110 are the big ones, ~215
# findings between them) is worth doing — but as its own PR, with the
# code changes alongside, not as a silent build break.
[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
